name: v0.7.7 syntax check

on:
  push:
    branches:
      - feature/v0.7.7-dashboard-rebuild

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check JavaScript syntax
        run: |
          set -e
          for f in *.js content/*.js; do
            echo "Checking $f"
            node --check "$f"
          done
